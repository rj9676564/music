services:
  molten-backend:
    image: ghcr.io/rj9676564/molten-music-backend:latest
    container_name: molten-backend
    restart: always
    ports:
      - "58081:8080"
    environment:
      # 如果需要摘要功能，请在此配置
      # - OPENAI_API_KEY=sk-...
      # - OPENAI_API_BASE=https://api.openai.com/v1
      # - OPENAI_MODEL=gpt-4o-mini
      # - LLM_DISABLE_THINKING=true
      # - TRANSLATE_TARGET_LANG=中文
    volumes:
      - ./media_cache:/app/media_cache
      - ./pb_data:/app/pb_data
    logging:
      driver: "json-file"
      options:
        max-size: "300m"
        max-file: "3"
