appId: com.molten.music
productName: Molten Music
directories:
  output: release/${version}
compression: maximum
asar: true
electronLanguages:
  - en
  - zh-CN
files:
  - dist
  - dist-electron
  - package.json
mac:
  artifactName: ${productName}_${version}_${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
  icon: public/icon.png
  category: public.app-category.music
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
dmg:
  artifactName: ${productName}_${version}_${arch}.${ext}
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications
win:
  target: nsis
  artifactName: ${productName}_${version}_${arch}.${ext}
  icon: public/icon.png
linux:
  target: AppImage
  artifactName: ${productName}_${version}_${arch}.${ext}
  icon: public/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

